# Publishes the week's blog post.
#
# Posts are merged ahead of time with a future `published` date (src/lib/content-policy.mjs). The
# site only shows a post from the first build on or after that date, so each
# Monday something has to cause a build. This job does, by adding one line to
# blog/PUBLISHED.md and pushing it: Netlify rebuilds the site on every push to
# main, so no Netlify credentials or build hook are needed. It only commits in
# a week with a post due, so a quiet week costs no build.
#
# NoCo's build refuses to run while any fact in src/data/layers has passed its
# recheck date (scripts/check-layers.mjs). So first, every Monday, this job
# re-reads each fact due in the next 14 days from its source
# (scripts/recheck-sources.mjs) and moves the date on for every fact whose exact
# quote is still there; those moves ride in the same commit as the post. If a
# fact has changed, cannot be read, or would block today's build, the job fails
# loudly with the list (and holds the post rather than push a build that would
# fail), so a person rewrites it during the week.
#
# After pushing it checks the live site until the new post answers, and fails
# if it never does. GitHub emails a failed scheduled run to whoever last edited
# the schedule below, so a post that did not go out is never silent.
#
# Run it by hand from the Actions tab (workflow_dispatch):
#   - check_only = true: tests that the job can push, publishes nothing.
#   - check_only = false: publishes any post due this week now, e.g. if Monday's
#     run failed.
name: Weekly blog publish

on:
  schedule:
    # Mondays 11:00 UTC: 7am in Myrtle Beach in summer, 6am in winter.
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only test that this job can push to main; publish nothing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: weekly-blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Re-check facts due in the next 14 days
        id: facts
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          node scripts/recheck-sources.mjs --by "$(date -u -d '+14 days' +%F)" --apply | tee recheck-report.txt
          # The water-rates table and CSV print each fact's checked date; regenerate them or the build's --check fails.
          node scripts/build-water-rates.mjs
          if node scripts/check-layers.mjs --quiet > layers-today.txt 2>&1; then echo "build_ok=true" >> "$GITHUB_OUTPUT"; else echo "build_ok=false" >> "$GITHUB_OUTPUT"; fi
          if node scripts/check-layers.mjs --quiet --today "$(date -u -d '+7 days' +%F)" > layers-next-week.txt 2>&1; then echo "next_ok=true" >> "$GITHUB_OUTPUT"; else echo "next_ok=false" >> "$GITHUB_OUTPUT"; fi
          rm -f recheck-report.txt

      - id: due
        run: node scripts/post-due.mjs | tee /dev/stderr | grep -E '^(due|slugs)=' >> "$GITHUB_OUTPUT"

      - name: Check this job can push (publishes nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.check_only
        run: |
          git push --dry-run origin HEAD:main
          echo "Push access OK. Due this week: '${{ steps.due.outputs.slugs }}'"

      - name: Publish this week's post
        if: steps.due.outputs.due == 'true' && steps.facts.outputs.build_ok == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.check_only)
        env:
          SLUGS: ${{ steps.due.outputs.slugs }}
        run: |
          mkdir -p blog
          [ -f blog/PUBLISHED.md ] || printf '# Weekly blog: when each post was sent live\n\nOne line per publish, written by .github/workflows/weekly-publish.yml.\n\n' > blog/PUBLISHED.md
          for s in $SLUGS; do
            if grep -q " $s\$" blog/PUBLISHED.md; then echo "$s already logged"; else echo "$(TZ=America/Denver date +%F) $s" >> blog/PUBLISHED.md; fi
          done
          if git diff --quiet; then echo "Already published this week, nothing to do."; exit 0; fi
          git config user.name "NoCo Turf weekly blog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/PUBLISHED.md src/data/layers public/data src/content/guides/water-savings.md
          git commit -m "Publish this week's blog post: $SLUGS" -m "Facts whose exact quote is still on their source have their checked and recheck dates moved (scripts/recheck-sources.mjs)."
          git push origin HEAD:main

      - name: Check the post is live
        if: steps.due.outputs.due == 'true' && steps.facts.outputs.build_ok == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.check_only)
        env:
          SLUGS: ${{ steps.due.outputs.slugs }}
        run: |
          for s in $SLUGS; do
            url="https://www.nocoturf.com/guides/$s/"
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url?cb=$RANDOM")
              if [ "$code" = "200" ]; then echo "LIVE: $url"; continue 2; fi
              sleep 20
            done
            echo "::error::$url was not live 10 minutes after the push. Check the Netlify deploy for this commit."
            exit 1
          done

      - name: Facts that need a person
        if: always() && (steps.facts.outputs.build_ok == 'false' || steps.facts.outputs.next_ok == 'false')
        run: |
          if [ "${{ steps.facts.outputs.build_ok }}" = "false" ]; then
            echo "::error::A fact has passed its recheck date, so today's build would fail. This week's post was held. Rewrite or re-verify these, then run this job by hand with check_only off:"
            grep FAIL layers-today.txt || true
          else
            echo "::error::Published, but these facts expire within 7 days and could not be re-verified automatically. Fix them before next Monday:"
            grep FAIL layers-next-week.txt || true
          fi
          exit 1
