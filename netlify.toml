# Astro static build. Content ships in the raw HTML response — retrieval agents (OAI-SearchBot,
# Claude-SearchBot, PerplexityBot, Bingbot) cannot read a hydration-only page.
# Pushing to main triggers a build on Brian's Netlify account: push only on Ty's explicit go.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

# The apex has been a GoDaddy self-forward loop (https://nocoturf.com → itself). Once DNS points
# here: every apex URL → www in ONE hop, path kept. The legacy/vendor URL map is public/_redirects
# (processed before these rules), so an old apex path lands on its new page in a single 301 too.
[[redirects]]
  from = "https://nocoturf.com/*"
  to = "https://www.nocoturf.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://nocoturf.com/*"
  to = "https://www.nocoturf.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Astro fingerprints every file in /_astro/: cache for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML revalidates — the vendor site served HTML with max-age=2592000 (30 days), which is why stale
# pages can linger after cutover. Never again.
[[headers]]
  for = "/*/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Markdown mirrors and llms.txt for answer engines: fetchable, never the page that ranks.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
